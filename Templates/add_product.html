{% extends "base.html" %}

{% block title %}เพิ่มสินค้าใหม่{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="fas fa-plus-circle me-2"></i> เพิ่มสินค้าใหม่</h2>
    <a href="{{ url_for('product.products_list') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>ย้อนกลับ</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('product.add_product') }}" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">ชื่อสินค้า:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">รายละเอียด:</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="cost" class="form-label">ต้นทุน (บาท):</label>
                    <input type="number" class="form-control" id="cost" name="cost" value="0.00" step="0.01" min="0" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="price" class="form-label">ราคาขาย (บาท):</label>
                    <input type="number" class="form-control" id="price" name="price" value="0.00" step="0.01" min="0" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="stock" class="form-label">สต็อก:</label>
                    <input type="number" class="form-control" id="stock" name="stock" value="0" min="0" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="sku" class="form-label">SKU (รหัสสินค้า):</label>
                    <input type="text" class="form-control" id="sku" name="sku">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">หมวดหมู่:</label>
                    <input class="form-control" list="category_suggestions" id="category" name="category" placeholder="พิมพ์เพื่อค้นหาหรือเพิ่มใหม่...">
                    <datalist id="category_suggestions">
                        {% for cat in existing_categories %}
                        <option value="{{ cat }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>
            <div class="mb-3">
                <label for="image_file" class="form-label">รูปภาพสินค้า:</label>
                <input type="file" class="form-control" id="image_file" name="image_file" accept="image/png, image/jpeg, image/jpg, image/gif">
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-dark btn-lg"><i class="fas fa-save me-2"></i> บันทึกสินค้า</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
