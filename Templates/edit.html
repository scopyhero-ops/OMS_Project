{% extends "base.html" %}

{% block title %}แก้ไขข้อมูลลูกค้า{% endblock %}

{% block content %}
<h2 class="mb-4">แก้ไขข้อมูลลูกค้า: {{ customer.first_name }} {{ customer.last_name }}</h2>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('customer.edit_customer', id=customer.id) }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="first_name" class="form-label">ชื่อ:</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ customer.first_name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="last_name" class="form-label">นามสกุล:</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ customer.last_name }}" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">อีเมล:</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ customer.email }}">
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">เบอร์โทรศัพท์:</label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ customer.phone }}">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">ที่อยู่:</label>
                <textarea class="form-control" id="address" name="address" rows="3">{{ customer.address }}</textarea>
            </div>
            <div class="mb-3">
                <label for="date_of_birth" class="form-label">วันเกิด:</label>
                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ customer.date_of_birth }}">
            </div>
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> บันทึกการเปลี่ยนแปลง</button>
                <a href="{{ url_for('customer.index') }}" class="btn btn-secondary btn-lg"><i class="fas fa-arrow-alt-circle-left"></i> ย้อนกลับ</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
